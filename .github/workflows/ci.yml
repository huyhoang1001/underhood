name: Underhood CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Code & Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate MDX Content Schema
        run: bun run validate:content

      - name: Type Check
        run: bun run lint

      - name: Run Unit Tests
        run: bun run test

      - name: Build Application
        run: bun run build
